name: ADAG fictional driver checks
on:
  push:
    branches: [dev/nov9-field-corrections]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/field-corrections.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --only-shell
      - run: node tests/browser-smoke.cjs
